name: Build luci-app-xray (armsr/armv8)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build IPK Package
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Checkout ke direktori terpisah bernama 'src' untuk menghindari nesting
          path: src
          
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-setuptools python3-dev rsync subversion swig time xsltproc zlib1g-dev wget unzip
          
      - name: Download & Extract OpenWrt SDK
        run: |
          SDK_FILE=$(curl -s https://downloads.openwrt.org/snapshots/targets/armsr/armv8/sha256sums | grep openwrt-sdk | awk '{print $2}' | sed 's/*//')
          wget "https://downloads.openwrt.org/snapshots/targets/armsr/armv8/$SDK_FILE" -O sdk.tar.xz
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk
          
      - name: Prepare Feeds & Inject Package
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Membuat folder spesifik dan menyalin isi repositori langsung ke dalamnya
          mkdir -p package/luci-app-xray
          cp -a ../src/* package/luci-app-xray/
          
      - name: Compile luci-app-xray
        run: |
          cd openwrt-sdk
          
          # Memaksa SDK agar mendaftarkan dan memilih package ini sebagai modul (.ipk)
          echo "CONFIG_PACKAGE_luci-app-xray=m" > .config
          make defconfig
          
          # Eksekusi kompilasi
          make package/luci-app-xray/compile V=s
          
      - name: Collect IPK Files
        run: |
          mkdir -p artifact
          find openwrt-sdk/bin/packages/ -name "*luci-app-xray*.ipk" -exec cp {} artifact/ \;
          
      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-armsr-armv8
          path: artifact/*.ipk
